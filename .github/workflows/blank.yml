name: AI Ecosystem CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  check-python:
    name: Check Python Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd ai_ecosystem/vantacore/vantacore_backend
          pip install -r requirements.txt
      
      - name: Check Python syntax
        run: |
          cd ai_ecosystem/vantacore/vantacore_backend
          python -m py_compile src/main.py src/models/user.py src/routes/user.py src/routes/vantacore.py

  check-frontend:
    name: Check Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies and build
        run: |
          cd ai_ecosystem/ai_dev_suite/ai_dev_suite_app
          npm install
          npm run build
